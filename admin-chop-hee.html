<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทีมงาน — ตรวจสอบใบสมัคร Whitelist | MEDIEVAL ONLINE ROLEPLAY TH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Noto+Serif+Thai:wght@400;500;600;700&display=swap');

:root{
  --wood-dark:#241a10; --wood:#3a2814; --wood-light:#5a3f22;
  --gold:#c9a35c; --gold-bright:#e8c983; --gold-dim:#8a6a3a;
  --parchment:#e9d9b3; --parchment-dark:#d8c497;
  --ink:#3b2b18; --ink-soft:#5a4630;
  --red:#7a2020; --red-bright:#9c2c2c;
  --ok:#3d6b3f; --ok-bright:#5c9c5f;
  --danger:#7a2020; --danger-bright:#9c2c2c;
  --info:#2f5170; --info-bright:#3f6f96;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Serif Thai', Georgia, serif;
  line-height:1.7;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 15% -20%, #2a1c0f 0%, transparent 60%),
    linear-gradient(180deg, #1c130a, #14100a 100%);
  padding-bottom:80px;
}

.gold-bar{ height:10px; width:100%; background: linear-gradient(90deg, transparent, var(--gold-dim) 15%, var(--gold-bright) 50%, var(--gold-dim) 85%, transparent); opacity:.9; }
header.hero{ padding:40px 20px 28px; text-align:center; }
.tagline{ display:inline-block; font-family:'Noto Serif Thai', serif; font-size:11px; letter-spacing:.35em; color:var(--gold-dim); border:1px solid var(--gold-dim); padding:6px 14px; border-radius:2px; text-transform:uppercase; margin-bottom:16px; }
h1{ font-family:'Noto Serif Thai','Cinzel',serif; margin:0; font-weight:700; font-size:clamp(24px,4.6vw,34px); letter-spacing:.02em; color:var(--gold-bright); text-shadow:0 2px 14px rgba(0,0,0,.6); }
h1 span{color:var(--parchment);}

main{ max-width:1000px; margin:36px auto; padding:0 20px; }

/* ---- Parchment / wood frame wrapper, matching whitelist-form.html ---- */
.mo-frame{ background:linear-gradient(180deg, var(--parchment), var(--parchment-dark)); border-radius:10px; padding:2px; box-shadow:var(--shadow); position:relative; margin-bottom:20px; }
.mo-frame-inner{ border-radius:8px; border:3px solid var(--wood-light); outline:1px solid var(--gold-dim); outline-offset:-7px; padding:26px clamp(14px,4vw,34px); position:relative; }
.mo-corner{position:absolute; width:22px; height:22px; border:2px solid var(--gold); opacity:.85; pointer-events:none;}
.mo-corner.tl{top:6px;left:6px;border-right:none;border-bottom:none}
.mo-corner.tr{top:6px;right:6px;border-left:none;border-bottom:none}
.mo-corner.bl{bottom:6px;left:6px;border-right:none;border-top:none}
.mo-corner.br{bottom:6px;right:6px;border-left:none;border-top:none}

.auth-card{ text-align:center; max-width:520px; margin:0 auto; }
.discord-btn{ display:inline-flex; align-items:center; gap:10px; background:#5865F2; color:#fff; border:none; font-family:'Noto Serif Thai', sans-serif; font-weight:600; font-size:15px; padding:13px 28px; border-radius:4px; cursor:pointer; text-decoration:none; transition:filter .15s; }
.discord-btn:hover{filter:brightness(1.1);}
.redirect-hint{ margin-top:16px; font-size:11px; color:var(--ink-soft); word-break:break-all; }
.denied{ color:var(--red-bright); font-size:14px; margin-top:14px; display:none; font-weight:600; }
.denied.show{display:block;}

.toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
.toolbar .who{ font-size:13px; color:#c7b990; }
.filter-row{ display:flex; gap:8px; flex-wrap:wrap; }
.filter-btn{
  background:rgba(233,217,179,0.08); border:1px solid var(--gold-dim); color:#c7b990;
  padding:7px 14px; border-radius:20px; font-size:12.5px; cursor:pointer; font-family:'Noto Serif Thai',sans-serif;
}
.filter-btn.active{ border-color:var(--gold-bright); color:var(--gold-bright); background:rgba(233,217,179,0.16); }
.refresh-btn{ background:rgba(233,217,179,0.08); border:1px solid var(--gold-dim); color:var(--parchment); padding:7px 14px; border-radius:4px; font-size:12.5px; cursor:pointer; font-family:'Noto Serif Thai',sans-serif; }

.app-list{ display:flex; flex-direction:column; gap:14px; }
.app-card{ background:linear-gradient(180deg, var(--parchment), var(--parchment-dark)); border-radius:10px; padding:2px; box-shadow:var(--shadow); }
.app-card-inner{ border-radius:8px; border:3px solid var(--wood-light); outline:1px solid var(--gold-dim); outline-offset:-6px; overflow:hidden; }
.app-card-head{
  padding:16px 20px; display:flex; justify-content:space-between; align-items:center;
  cursor:pointer; gap:12px; flex-wrap:wrap;
}
.app-card-head .left{ display:flex; align-items:center; gap:12px; }
.app-card-head img{ width:32px; height:32px; border-radius:50%; border:2px solid var(--gold-dim); }
.app-card-head .name{ font-weight:600; font-size:14.5px; color:var(--ink); }
.app-card-head .meta{ font-size:12px; color:var(--ink-soft); }
.status-pill{ padding:6px 14px; border-radius:20px; font-weight:700; font-size:12px; border:1px solid currentColor; white-space:nowrap; background:rgba(255,255,255,0.25); }
.app-card-body{ display:none; padding:0 20px 20px; border-top:2px solid var(--gold-dim); }
.app-card-body.open{ display:block; }
.field{ padding:14px 0; border-bottom:1px solid var(--gold-dim); }
.field:last-of-type{ border-bottom:none; }
.field .label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin-bottom:4px; font-weight:600; }
.field .value{ font-size:14px; white-space:pre-wrap; color:var(--ink); }
.review-row{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--gold-dim); display:flex; flex-direction:column; gap:10px; }
select, textarea.admin-comment{
  width:100%; background:rgba(255,255,255,0.45); border:1px solid var(--gold-dim); border-radius:3px;
  color:var(--ink); padding:10px 12px; font-family:'Noto Serif Thai', sans-serif; font-size:14px;
}
textarea.admin-comment{ min-height:70px; resize:vertical; }
textarea.admin-comment:focus, select:focus{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(122,32,32,0.15); background:rgba(255,255,255,0.65); }
.review-actions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.save-btn{
  background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:var(--wood-dark); border:2px solid var(--wood-light); font-weight:700; font-size:13.5px;
  padding:10px 22px; border-radius:3px; cursor:pointer; font-family:'Noto Serif Thai',sans-serif; letter-spacing:.03em;
}
.save-btn:disabled{opacity:.5; cursor:not-allowed;}
.delete-btn{
  background:transparent; color:var(--red); border:1px solid var(--red); font-weight:600; font-size:13px;
  padding:9px 18px; border-radius:3px; cursor:pointer; font-family:'Noto Serif Thai',sans-serif;
}
.delete-btn:hover{ background:rgba(122,32,32,0.12); }
.delete-btn:disabled{opacity:.5; cursor:not-allowed;}
.cleanup-btn{
  background:transparent; color:var(--red-bright); border:1px solid var(--red-bright); font-size:12.5px;
  padding:7px 14px; border-radius:4px; cursor:pointer; font-family:'Noto Serif Thai',sans-serif;
}
.cleanup-btn:hover{ background:rgba(122,32,32,0.12); }
.cleanup-btn:disabled{opacity:.5; cursor:not-allowed;}
.save-status{ font-size:12.5px; color:#c7b990; }
.empty-msg{ text-align:center; color:#c7b990; padding:40px 0; }
.loading{ text-align:center; color:#c7b990; font-size:13px; padding:30px 0; }
</style>
</head>
<body>

  <div class="gold-bar"></div>
  <header class="hero">
    <span class="tagline">Staff Only</span>
    <h1>ตรวจสอบใบสมัคร <span>Whitelist</span></h1>
  </header>

  <main>
    <div id="authWrap">
      <div class="mo-frame">
        <div class="mo-frame-inner auth-card" id="authCard">
          <span class="mo-corner tl"></span><span class="mo-corner tr"></span>
          <span class="mo-corner bl"></span><span class="mo-corner br"></span>
          <a href="#" id="discordLoginBtn" class="discord-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.106c.36.698.772 1.362 1.225 1.994a.077.077 0 0 0 .084.028 19.83 19.83 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.662a.06.06 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            เข้าสู่ระบบด้วย Discord
          </a>
          <div class="denied" id="deniedMsg">บัญชี Discord นี้ไม่ได้อยู่ในรายชื่อทีมงาน กรุณาเข้าสู่ระบบด้วยบัญชีที่ได้รับอนุญาต</div>
        </div>
      </div>
    </div>

    <div id="panelWrap" style="display:none;">
      <div class="toolbar">
        <div class="who" id="whoAmI"></div>
        <span class="logout-link" id="logoutLink" style="color:#c7b990;font-size:12.5px;text-decoration:underline;cursor:pointer;">ออกจากระบบ</span>
        <div class="filter-row" id="filterRow">
          <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
          <button class="filter-btn" data-filter="pending">รอตรวจสอบ</button>
          <button class="filter-btn" data-filter="approved">ผ่าน</button>
          <button class="filter-btn" data-filter="approved_waiting">ผ่านแล้วรอเซิฟเปิด</button>
          <button class="filter-btn" data-filter="rejected">ไม่ผ่าน</button>
          <button class="filter-btn" data-filter="needs_revision">ต้องแก้ไข</button>
        </div>
        <div class="filter-row" id="typeFilterRow">
          <button class="filter-btn active" data-type-filter="all">ทุกประเภท</button>
          <button class="filter-btn" data-type-filter="regular">สมัครทั่วไป</button>
          <button class="filter-btn" data-type-filter="streamer">📺 สตรีมเมอร์</button>
        </div>
        <button class="refresh-btn" id="refreshBtn">โหลดใหม่</button>
        <button class="cleanup-btn" id="cleanupBtn">ลบใบสมัคร Rejected เกิน 90 วัน</button>
      </div>
      <div class="save-status" id="cleanupStatus" style="margin-bottom:14px;"></div>

      <div class="loading" id="loadingMsg">กำลังโหลดใบสมัคร...</div>
      <div class="empty-msg" id="emptyMsg" style="display:none;">ยังไม่มีใบสมัครในระบบ</div>
      <div class="app-list" id="appList"></div>
    </div>
  </main>

<script src="firebase-config.js"></script>
<script src="firebase-storage.js"></script>
<script>
(function(){
  // ============ CONFIG ============
  // TODO: ใส่ Client ID เดียวกับหน้าอื่น
  const DISCORD_CLIENT_ID = '1534483543462248480';
  const REDIRECT_URI = window.location.origin + window.location.pathname;
  const OAUTH_SCOPE = 'identify';

  // TODO: ใส่ Discord User ID ของทีมงานที่อนุญาตให้เข้าหน้านี้ (คลิกขวาชื่อตัวเองใน Discord -> Copy User ID)
  // หมายเหตุด้านความปลอดภัย: รายชื่อนี้อยู่ในโค้ดฝั่งเบราว์เซอร์ ใครก็ตามที่เปิดดูซอร์สโค้ดจะเห็นรายชื่อ ID ได้
  // (แต่ยังต้องมี access token ของบัญชีนั้นจริงๆ ถึงจะผ่านการตรวจสอบตอน login ได้)
  const STAFF_DISCORD_IDS = [
    '428540830056448001',
    '299543390046126081',
    '415630632300052492',
    '1332381770443788318',
    '431804266932600832',
    '959086066860711936',
    '274764720685187073',
    '795636332239257642'    
  ];
  // ==================================

  function buildLoginUrl(){
    const params = new URLSearchParams({
      client_id: DISCORD_CLIENT_ID,
      redirect_uri: REDIRECT_URI,
      response_type: 'token',
      scope: OAUTH_SCOPE
    });
    return 'https://discord.com/oauth2/authorize?' + params.toString();
  }
  document.getElementById('discordLoginBtn').href = buildLoginUrl();

  // ============ SESSION PERSISTENCE ============
  // เก็บ access token ไว้ใน localStorage เพื่อไม่ต้องให้ทีมงานล็อกอินใหม่ทุกครั้งที่รีเฟรชหน้า
  const SESSION_KEY = 'mo_discord_session';

  function saveSession(token, expiresIn){
    try{
      const expiresAt = Date.now() + (Number(expiresIn) || 604800) * 1000;
      localStorage.setItem(SESSION_KEY, JSON.stringify({ token, expiresAt }));
    }catch(e){ /* localStorage ไม่พร้อมใช้งาน (โหมดส่วนตัว ฯลฯ) ข้ามไปเฉยๆ */ }
  }

  function loadSession(){
    try{
      const raw = localStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data.token || !data.expiresAt || Date.now() >= data.expiresAt){
        localStorage.removeItem(SESSION_KEY);
        return null;
      }
      return data.token;
    }catch(e){ return null; }
  }

  function clearSession(){
    try{ localStorage.removeItem(SESSION_KEY); }catch(e){ /* ignore */ }
  }
  // ================================================

  function parseAccessToken(){
    if(!window.location.hash) return null;
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const token = hash.get('access_token');
    if(!token) return null;
    return { token, expiresIn: hash.get('expires_in') };
  }

  const STATUS_LABELS = {
  pending: { label: 'รอตรวจสอบ', color: '#fff0be', bg: '#76520f' },
  approved: { label: 'ผ่านการพิจารณา', color: '#e5ffea', bg: '#1f6b3a' },
  approved_waiting: { label: 'ผ่านแล้วรอเซิฟเปิด', color: '#123d1a', bg: '#b7f2b0' },
  rejected: { label: 'ไม่ผ่านการพิจารณา', color: '#ffe8e8', bg: '#8b2020' },
  needs_revision: { label: 'ต้องแก้ไขก่อน', color: '#e4f3ff', bg: '#1f4f78' }
  };

  const questionLabels = {
    q4: 'ชื่อ-นามสกุล (IC) และอายุ (IC)',
    q4Name: 'ชื่อ-นามสกุล (IC)',
    q4Age: 'อายุ (IC)',
    q2: 'Social Media',
    q5: 'บทบาทตัวละครกับเนื้อเรื่อง / ลักษณะตัวละคร',
    q6: 'ประสบการณ์การเล่น Roleplay ที่ผ่านมา',
    q7: 'การละเมิดกฎ Common Courtesy',
    q8: 'กฎ Character Customization Rules',
    q9: 'RDM คืออะไร',
    q10: 'ความแตกต่างระหว่าง breaking character กับ /ooc',
    q11: 'อธิบายคำว่า Metagaming',
    q12: 'จำนวนผู้เข้าร่วมปะทะฉับพลันที่อนุญาต',
    q13: 'กฎ Immersive Movement',
    q14: 'กรณีขโมยของและสังหารกษัตริย์ - กฎที่ละเมิดและควรทำอย่างไรให้ดีขึ้น',
    q15: 'สถานการณ์อัศวินเจรจากับโจรที่ลักพาตัวชายชรา',
    q16: 'กรณีรับงานซ่อมแซมแต่ไม่พบฉากในเกม'
  };

  // คำถามของใบสมัคร Streamer แยกจาก Whitelist ปกติ
  const streamerQuestionLabels = {
    q4: 'ชื่อ-นามสกุล (IC) และอายุ (IC)',
    q4Name: 'ชื่อ-นามสกุล (IC)',
    q4Age: 'อายุ (IC)',
    q2: 'Social Media',
    q5: 'บทบาทตัวละครกับเนื้อเรื่อง / ลักษณะตัวละคร',
    q6: 'ประสบการณ์การเล่น Roleplay / ผลงานที่ผ่านมา',
    q7: 'RDM คืออะไร',
    q8: 'ความแตกต่างระหว่าง breaking character กับ /ooc',
    q9: 'จำนวนผู้เข้าร่วมปะทะฉับพลันที่อนุญาต',
    q10: 'โหน้อง ขับรถชนพี่ ไม่ลงมาขอโทษ ไม่ลงมาดูเลย แล้วขับหนีมาตั้งไกล โอ้โหอะไรวะคนไทย?'
  };

  const authWrap = document.getElementById('authWrap');
  const panelWrap = document.getElementById('panelWrap');
  const deniedMsg = document.getElementById('deniedMsg');
  const appList = document.getElementById('appList');
  const loadingMsg = document.getElementById('loadingMsg');
  const emptyMsg = document.getElementById('emptyMsg');

  let staffUser = null;
  let allRecords = [];
  let currentFilter = 'all';
  let currentTypeFilter = 'all';
  let openKeys = new Set(); // เก็บ key ของใบสมัครที่เปิดดูอยู่ ไม่ให้ auto-refresh ไปหุบทิ้ง

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : str;
    return d.innerHTML;
  }

  async function loadApplications(){
    loadingMsg.style.display = 'block';
    emptyMsg.style.display = 'none';
    appList.innerHTML = '';
    try{
      const listRes = await window.storage.list('application:', true);
      const keys = (listRes && listRes.keys) || [];
      const records = [];
      for(const key of keys){
        try{
          const r = await window.storage.get(key, true);
          if(r) records.push({ key, record: JSON.parse(r.value) });
        }catch(e){ /* skip unreadable entry */ }
      }
      records.sort((a,b)=> new Date(b.record.submittedAt) - new Date(a.record.submittedAt));
      allRecords = records;
      renderList();
    }catch(e){
      appList.innerHTML = '<div class="empty-msg">โหลดข้อมูลไม่สำเร็จ กรุณากด "โหลดใหม่"</div>';
    }
    loadingMsg.style.display = 'none';
  }

  function renderList(){
    let filtered = currentFilter === 'all'
      ? allRecords
      : allRecords.filter(x => (x.record.status || 'pending') === currentFilter);

    if(currentTypeFilter !== 'all'){
      filtered = filtered.filter(x => (x.record.type === 'streamer' ? 'streamer' : 'regular') === currentTypeFilter);
    }

    appList.innerHTML = '';
    if(filtered.length === 0){
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    filtered.forEach(({key, record})=>{
      const st = STATUS_LABELS[record.status] || STATUS_LABELS.pending;
      const isStreamer = record.type === 'streamer';
      const card = document.createElement('div');
      card.className = 'app-card';

      // แยกคำตอบตามประเภทใบสมัคร: Whitelist และ Streamer จะใช้ชุดคำถามของตัวเอง
      const labels = isStreamer ? streamerQuestionLabels : questionLabels;
      const answersHtml =
        Object.keys(labels).map(id=>{
          if(record.answers && record.answers[id] !== undefined){
            return '<div class="field"><div class="label">' + escapeHtml(labels[id]) + '</div>' +
                   '<div class="value">' + escapeHtml(record.answers[id] || '-') + '</div></div>';
          }
          return '';
        }).join('') +
        (isStreamer && record.platform ? '<div class="field"><div class="label">แพลตฟอร์ม</div><div class="value">' + escapeHtml(record.platform) + '</div></div>' : '') +
        (isStreamer && record.audienceSize ? '<div class="field"><div class="label">ผู้ติดตาม / ผู้ชมเฉลี่ย</div><div class="value">' + escapeHtml(record.audienceSize) + '</div></div>' : '') +
        (isStreamer && record.extraInfo ? '<div class="field"><div class="label">ข้อมูลเพิ่มเติม</div><div class="value">' + escapeHtml(record.extraInfo) + '</div></div>' : '');

      // แจ้งเตือนแบบเห็นชัดๆ ว่าใบนี้เป็นการ "แก้ไขแล้วส่งใหม่" จากผู้สมัคร
      const isResubmission = !!record.resubmittedAt;
      const resubmitBadge = isResubmission
        ? '<span class="status-pill" style="color:var(--info); margin-right:8px;">🔁 แก้ไขและส่งใหม่</span>'
        : '';
      const streamerBadge = isStreamer
        ? '<span class="status-pill" style="color:#c58bff; margin-right:8px;">📺 สตรีมเมอร์</span>'
        : '';
      const previousCommentHtml = record.previousComment
        ? '<div class="field"><div class="label">ความเห็นเดิม (ก่อนแก้ไขรอบนี้)</div><div class="value">' + escapeHtml(record.previousComment) + '</div></div>'
        : '';

      card.innerHTML =
        '<div class="app-card-inner">' +
        '<div class="app-card-head">' +
          '<div class="left">' +
            '<div>' +
              '<div class="name">' + escapeHtml(record.discordUsername || record.discordId) + '</div>' +
              '<div class="meta">Steam: ' + escapeHtml(record.steamId) + ' · ' + new Date(record.submittedAt).toLocaleString('th-TH') + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;">' + streamerBadge + resubmitBadge +
          '<div class="status-pill main-status" style="color:' + st.color + ';background:' + st.bg + ';border-color:' + st.bg + '">' + st.label + '</div></div>' +
        '</div>' +
        '<div class="app-card-body">' +
          '<div class="field"><div class="label">Discord ID</div><div class="value">' + escapeHtml(record.discordId) + '</div></div>' +
          '<div class="field"><div class="label">ลิงก์ช่องทางการสตรีม</div><div class="value">' + escapeHtml(record.streamLink) + '</div></div>' +
          previousCommentHtml +
          answersHtml +
          '<div class="review-row">' +
            '<select class="status-select">' +
              Object.keys(STATUS_LABELS).map(k=>'<option value="'+k+'"'+(record.status===k?' selected':'')+'>'+STATUS_LABELS[k].label+'</option>').join('') +
            '</select>' +
            '<textarea class="admin-comment" placeholder="ความเห็นถึงผู้สมัคร เช่น เหตุผลที่ไม่ผ่าน หรือข้อที่ต้องแก้ไข...">' + escapeHtml(record.adminComment || '') + '</textarea>' +
            '<div class="review-actions">' +
              '<button class="save-btn">บันทึกผลการตรวจสอบ</button>' +
              '<button class="delete-btn"' + (record.status !== 'rejected' ? ' disabled title="ลบได้เฉพาะใบที่สถานะ ไม่ผ่านการพิจารณา เท่านั้น"' : '') + '>ลบใบสมัครนี้</button>' +
              '<span class="save-status"></span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '</div>';

      const head = card.querySelector('.app-card-head');
      const body = card.querySelector('.app-card-body');
      if(openKeys.has(key)) body.classList.add('open');
      head.addEventListener('click', ()=>{
        body.classList.toggle('open');
        if(body.classList.contains('open')) openKeys.add(key);
        else openKeys.delete(key);
      });

      const saveBtn = card.querySelector('.save-btn');
      const deleteBtn = card.querySelector('.delete-btn');
      const saveStatusEl = card.querySelector('.save-status');
      saveBtn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const newStatus = card.querySelector('.status-select').value;
        const newComment = card.querySelector('.admin-comment').value.trim();
        saveBtn.disabled = true;
        saveStatusEl.textContent = 'กำลังบันทึก...';
        const updated = Object.assign({}, record, {
          status: newStatus,
          adminComment: newComment,
          reviewedAt: new Date().toISOString(),
          reviewedBy: staffUser.username,
          resubmittedAt: null, // ตรวจแล้ว เลยเอาป้าย "แก้ไขและส่งใหม่" ออก
          previousComment: null
        });
        try{
          const ok = await window.storage.set(key, JSON.stringify(updated), true);
          if(!ok) throw new Error('save failed');
          saveStatusEl.textContent = 'บันทึกแล้ว ✓';
          record.status = newStatus;
          record.adminComment = newComment;
          record.reviewedAt = updated.reviewedAt;
          record.resubmittedAt = null;
          record.previousComment = null;
          const pill = card.querySelector('.main-status');
          const s = STATUS_LABELS[newStatus];
          pill.textContent = s.label;
          pill.style.color = s.color;
          pill.style.background = s.bg;
          pill.style.borderColor = s.bg;
          // ปุ่มลบใช้ได้เฉพาะตอนสถานะเป็น "ไม่ผ่านการพิจารณา" เท่านั้น
          // (ตรงกับ Firestore Security Rules ที่อนุญาต delete เฉพาะ status == 'rejected')
          deleteBtn.disabled = newStatus !== 'rejected';
          deleteBtn.title = newStatus !== 'rejected'
            ? 'ลบได้เฉพาะใบที่สถานะ ไม่ผ่านการพิจารณา เท่านั้น'
            : '';
        }catch(err){
          saveStatusEl.textContent = 'บันทึกไม่สำเร็จ ลองอีกครั้ง';
        }
        saveBtn.disabled = false;
      });

      deleteBtn.addEventListener('click', async (e)=>{
        e.stopPropagation();
        const confirmed = confirm(
          'ยืนยันลบใบสมัครของ "' + (record.discordUsername || record.discordId) + '" ถาวร?\การลบนี้กู้คืนไม่ได้'
        );
        if(!confirmed) return;
        deleteBtn.disabled = true;
        saveStatusEl.textContent = 'กำลังลบ...';
        try{
          await window.storage.delete(key, true);
          allRecords = allRecords.filter(x => x.key !== key);
          card.remove();
          if(appList.children.length === 0) emptyMsg.style.display = 'block';
        }catch(err){
          saveStatusEl.textContent = 'ลบไม่สำเร็จ ลองอีกครั้ง';
          deleteBtn.disabled = false;
        }
      });

      appList.appendChild(card);
    });
  }

  document.getElementById('filterRow').addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('#filterRow .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderList();
  });

  document.getElementById('typeFilterRow').addEventListener('click', (e)=>{
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('#typeFilterRow .filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTypeFilter = btn.dataset.typeFilter;
    renderList();
  });

  document.getElementById('refreshBtn').addEventListener('click', loadApplications);

  document.getElementById('cleanupBtn').addEventListener('click', async ()=>{
    const cleanupStatus = document.getElementById('cleanupStatus');
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 90);

    const targets = allRecords.filter(({record})=>{
      if(record.status !== 'rejected') return false;
      const refDate = record.reviewedAt || record.submittedAt;
      if(!refDate) return false;
      return new Date(refDate) < cutoff;
    });

    if(targets.length === 0){
      cleanupStatus.textContent = 'ไม่มีใบสมัคร Rejected ที่เกิน 90 วัน';
      return;
    }

    const confirmed = confirm(
      'พบใบสมัคร Rejected ที่เกิน 90 วัน จำนวน ' + targets.length + ' ใบ\n' +
      'ยืนยันลบทั้งหมดถาวร? การลบนี้กู้คืนไม่ได้'
    );
    if(!confirmed) return;

    document.getElementById('cleanupBtn').disabled = true;
    let done = 0, failed = 0;
    for(const {key} of targets){
      try{
        await window.storage.delete(key, true);
        done++;
      }catch(e){ failed++; }
    }
    cleanupStatus.textContent = 'ลบสำเร็จ ' + done + ' ใบ' + (failed ? (', ล้มเหลว ' + failed + ' ใบ') : '');
    document.getElementById('cleanupBtn').disabled = false;
    loadApplications();
  });

  let refreshTimer = null;

  async function loginWithToken(token){
    const res = await fetch('https://discord.com/api/users/@me', {
      headers: { Authorization: 'Bearer ' + token }
    });
    if(!res.ok) throw new Error('discord api ' + res.status);
    const u = await res.json();

    if(!STAFF_DISCORD_IDS.includes(u.id)){
      clearSession();
      deniedMsg.classList.add('show');
      return;
    }

    staffUser = { id: u.id, username: u.username + (u.discriminator && u.discriminator !== '0' ? '#' + u.discriminator : '') };
    authWrap.style.display = 'none';
    panelWrap.style.display = 'block';
    document.getElementById('whoAmI').textContent = 'เข้าสู่ระบบในชื่อ: ' + staffUser.username;
    loadApplications();
    // โหลดใบสมัครใหม่อัตโนมัติทุก 3 นาที ไม่ต้องรอกด "โหลดใหม่" เอง
    // (การ์ดที่เปิดดูอยู่จะไม่ถูกหุบ เพราะ openKeys เก็บสถานะไว้ให้)
    if(refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(loadApplications, 6000);
  }

  document.getElementById('logoutLink').addEventListener('click', ()=>{
    clearSession();
    if(refreshTimer) clearInterval(refreshTimer);
    staffUser = null;
    authWrap.style.display = 'block';
    panelWrap.style.display = 'none';
    deniedMsg.classList.remove('show');
  });

  async function init(){
    const fresh = parseAccessToken();
    if(fresh){
      history.replaceState(null, '', REDIRECT_URI);
      saveSession(fresh.token, fresh.expiresIn);
      try{
        await loginWithToken(fresh.token);
      }catch(e){
        clearSession();
        deniedMsg.textContent = 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่';
        deniedMsg.classList.add('show');
      }
      return;
    }

    const saved = loadSession();
    if(saved){
      try{
        await loginWithToken(saved);
      }catch(e){
        clearSession();
      }
    }
  }
  init();
})();
</script>

</body>
</html>
