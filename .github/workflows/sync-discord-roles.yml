name: Sync approved Discord roles
on:
  schedule:
    - cron: "0 * * * *"  # รันทุก 1 ชัวโมง
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      # ดึง Firestore ครั้งเดียว บันทึกไว้ที่ /tmp/applications.json
      # สองขั้นตอนถัดไปอ่านจากไฟล์นี้ ไม่แตะ Firestore อีก
      - name: Fetch data from Firestore
        run: npm run fetch-data
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # ขั้นตอนที่ 1: แอดยศ Discord ตามผลตรวจ
      - name: Sync approved Discord roles
        run: npm run sync
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # ขั้นตอนที่ 2: ส่ง DM แจ้งผลให้ผู้สมัคร
      - name: Notify applicants by Discord DM
        continue-on-error: true
        run: npm run notify
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          REGULAR_FORM_URL: "https://medievalonline.github.io/whitelist-form-Medieval-TH/whitelist-form.html"
          STREAMER_FORM_URL: "https://medievalonline.github.io/whitelist-form-Medieval-TH/streamer-form.html"
